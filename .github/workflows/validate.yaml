name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Remove "brands" once the icon is submitted to home-assistant/brands
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant test harness and matching frontend
        run: |
          pip install pytest-homeassistant-custom-component
          pip install "$(python -c "import json, os, homeassistant; p = os.path.join(os.path.dirname(homeassistant.__file__), 'components/frontend/manifest.json'); print(json.load(open(p))['requirements'][0])")"
      - run: pytest -q
