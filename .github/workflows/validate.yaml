name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Only needed for the HACS default store: remove "brands" after
          # submitting the icon to home-assistant/brands, "topics" after adding
          # repo topics, "license" after adding a LICENSE file.
          ignore: brands license topics

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 installs an older HA release, 3.14 the newest one
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant test harness and matching frontend
        run: |
          pip install pytest-homeassistant-custom-component
          pip install "$(python -c "import json, os, homeassistant; p = os.path.join(os.path.dirname(homeassistant.__file__), 'components/frontend/manifest.json'); print(json.load(open(p))['requirements'][0])")"
      - name: Run tests (fail on Home Assistant deprecation warnings)
        run: |
          pytest -q 2>&1 | tee pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "Detected that custom integration 'manual_vault'" pytest.log; then
            echo "::error::Manual Vault uses deprecated Home Assistant APIs"; exit 1
          fi

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
